[workspace]
members = ["."]
resolver = "2"

[package]
name = "mesh-kvm"
version = "0.9.4"
edition = "2021"
description = "Zero-latency P2P Mesh Input, Clipboard, and Audio daemon bridging Debian 13 and Windows 11"

[[bin]]
name = "mesh-kvm"
path = "src/main.rs"

# Runs as root through pkexec to install a `.deb`, so it holds nothing but that job.
[[bin]]
name = "apply-update"
path = "src/update/apply/main.rs"

[features]
# Lets the release server, key and running version be set from outside, for tests that run the
# real programs. A shipped build never has this: `packaging/release.sh` checks for it.
test-hooks = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
arboard = { version = "3.4", features = ["wayland-data-control"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "persistence", "accesskit"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

snow = { version = "0.10", default-features = false, features = [
    "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom",
] }
spake2 = "0.4"
blake2 = "0.10"
getrandom = "0.2"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
tray-icon = "0.19"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_QoS",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
